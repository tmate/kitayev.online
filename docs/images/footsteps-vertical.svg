<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 340">
  <defs>
    <!-- Right shoe sole: toes point right (+x), outer edge at +y -->
    <!-- rotate(90) → left foot pointing down (outer edge left) -->
    <!-- rotate(90) scale(1,-1) → right foot pointing down (outer edge right) -->
    <path id="s" d="M-5,-1.5 C-7,-2 -7,2 -5,2 L-1,3.5 C2,4.5 5,4 6.5,2.5 Q7,1 6.5,-1.5 C5,-3.5 2,-3.5 -1,-2.5 Z"/>
  </defs>
  <g fill="#000" opacity="0.13">
    <!-- Person A alone, center x=22 -->
    <use href="#s" transform="translate(17,10) rotate(90)"/>
    <use href="#s" transform="translate(27,28) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(17,46) rotate(90)"/>
    <use href="#s" transform="translate(27,64) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(17,82) rotate(90)"/>

    <!-- Person B approaching from the right -->
    <use href="#s" transform="translate(44,74) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(40,90) rotate(90)"/>

    <!-- Walking together: A center x=12, B center x=36 -->
    <!-- A: LF x=7, RF x=17. B: LF x=29, RF x=39 -->
    <use href="#s" transform="translate(17,104) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(39,104) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(7,122) rotate(90)"/>
    <use href="#s" transform="translate(29,122) rotate(90)"/>
    <use href="#s" transform="translate(17,140) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(39,140) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(7,158) rotate(90)"/>
    <use href="#s" transform="translate(29,158) rotate(90)"/>
    <use href="#s" transform="translate(17,176) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(39,176) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(7,194) rotate(90)"/>
    <use href="#s" transform="translate(29,194) rotate(90)"/>
    <use href="#s" transform="translate(17,212) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(39,212) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(7,230) rotate(90)"/>
    <use href="#s" transform="translate(29,230) rotate(90)"/>
    <use href="#s" transform="translate(17,248) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(39,248) rotate(90) scale(1,-1)"/>

    <!-- Parting: A returns to center x=22, B diverges right off screen -->
    <use href="#s" transform="translate(9,264) rotate(90)"/>
    <use href="#s" transform="translate(33,264) rotate(90)"/>
    <use href="#s" transform="translate(20,282) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(44,280) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(16,300) rotate(90)"/>
    <use href="#s" transform="translate(24,318) rotate(90) scale(1,-1)"/>
    <use href="#s" transform="translate(20,336) rotate(90)"/>
  </g>
</svg>
